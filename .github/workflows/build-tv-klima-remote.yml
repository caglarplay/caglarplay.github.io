name: Build TV Klima Kumanda

on:
  push:
    branches: [tv-klima-kumanda]
    paths:
      - 'remote_app/**'
      - 'tv_mouse_helper/**'
      - '.github/workflows/build-tv-klima-remote.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create phone app shell
        run: |
          flutter create --platforms=android --org com.example --project-name remote_app remote_build
          rm -rf remote_build/lib
          cp -r remote_app/lib remote_build/lib
          cp remote_app/pubspec.yaml remote_build/pubspec.yaml
          sed -i 's/Colors.white46/Color(0x75FFFFFF)/g' remote_build/lib/main.dart
          cp remote_app/android_patch/MainActivity.kt remote_build/android/app/src/main/kotlin/com/example/remote_app/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('remote_build/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.TRANSMIT_IR"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-feature android:name="android.hardware.consumerir" android:required="false"/>'''
          s=s.replace(marker,perms)
          p.write_text(s)
          PY

      - name: Build phone APK
        working-directory: remote_build
        run: |
          flutter pub get
          flutter build apk --release

      - name: Create TV mouse helper shell
        run: |
          flutter create --platforms=android --org com.caglarplay --project-name tv_mouse_helper tv_mouse_build
          rm -rf tv_mouse_build/lib
          cp -r tv_mouse_helper/lib tv_mouse_build/lib
          cp tv_mouse_helper/pubspec.yaml tv_mouse_build/pubspec.yaml
          cp tv_mouse_helper/android_patch/MainActivity.kt tv_mouse_build/android/app/src/main/kotlin/com/caglarplay/tv_mouse_helper/MainActivity.kt
          cp tv_mouse_helper/android_patch/MouseAccessibilityService.kt tv_mouse_build/android/app/src/main/kotlin/com/caglarplay/tv_mouse_helper/MouseAccessibilityService.kt
          mkdir -p tv_mouse_build/android/app/src/main/res/xml
          cp tv_mouse_helper/android_patch/mouse_accessibility_service.xml tv_mouse_build/android/app/src/main/res/xml/mouse_accessibility_service.xml
          cp tv_mouse_helper/android_patch/AndroidManifest.xml tv_mouse_build/android/app/src/main/AndroidManifest.xml

      - name: Build TV helper APK
        working-directory: tv_mouse_build
        run: |
          flutter pub get
          flutter build apk --release

      - name: Collect APKs
        run: |
          mkdir -p out
          cp remote_build/build/app/outputs/flutter-apk/app-release.apk out/Kumanda.apk
          cp tv_mouse_build/build/app/outputs/flutter-apk/app-release.apk out/TV-Mouse-Yardimcisi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kumanda-Paketi
          path: out/*.apk
          retention-days: 14
