name: Build Parmak Klavye APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ParmakKlavyeBuild.zip'
      - '.github/workflows/parmak-klavye-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q ParmakKlavyeBuild.zip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle -p ParmakKlavyeBuild :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp ParmakKlavyeBuild/app/build/outputs/apk/debug/app-debug.apk ParmakKlavye-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParmakKlavye-v0.1-apk
          path: ParmakKlavye-v0.1.apk
          if-no-files-found: error
