name: Build Parmak Klavye APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ParmakKlavyeBuild.zip'
      - '.github/workflows/parmak-klavye-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q ParmakKlavyeBuild.zip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "Platforms:"
          ls -1 "$ANDROID_HOME/platforms" || true
          echo "Build tools:"
          ls -1 "$ANDROID_HOME/build-tools" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
            fi
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle -p ParmakKlavyeBuild :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp ParmakKlavyeBuild/app/build/outputs/apk/debug/app-debug.apk ParmakKlavye-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParmakKlavye-v0.1-apk
          path: ParmakKlavye-v0.1.apk
          if-no-files-found: error
