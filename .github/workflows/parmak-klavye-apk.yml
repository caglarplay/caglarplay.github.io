name: Build Parmak Klavye APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ParmakKlavyeBuild.zip'
      - '.github/workflows/parmak-klavye-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q ParmakKlavyeBuild.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p ParmakKlavyeBuild :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp ParmakKlavyeBuild/app/build/outputs/apk/debug/app-debug.apk ParmakKlavye-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParmakKlavye-v0.1-apk
          path: ParmakKlavye-v0.1.apk
          if-no-files-found: error
